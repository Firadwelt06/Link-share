<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAN Link Sharer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1050px; background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #ffffff; text-align: center; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 16px; }
        textarea { flex: 1; min-height: 72px; resize: vertical; padding: 12px; border-radius: 12px; border: 1px solid #45405c; background: #211e30; color: #fff; font-size: 15px; }
        input[type="text"]:focus { outline: none; border-color: #007bff; }
        textarea:focus { outline: none; border-color: #a78bfa; }
        button { padding: 12px 20px; border: none; border-radius: 6px; background: #007bff; color: white; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .list-actions { display: flex; justify-content: flex-end; margin-bottom: 12px; }
        .list-actions button { padding: 7px 11px; font-size: 13px; }
        .workspace-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 0.72fr); gap: 24px; align-items: start; }
        section { min-width: 0; }
        h3 { margin: 0 0 12px; }
        .messages-panel { padding: 18px; border: 1px solid #39334e; border-radius: 14px; background: linear-gradient(145deg, #282338, #211f2b 65%); }
        .messages-heading { display: flex; align-items: center; gap: 9px; }
        .chat-icon { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 10px; background: #514078; }
        .message-composer { display: grid; gap: 9px; margin: 0 0 12px; }
        .message-composer button { justify-self: end; padding: 9px 16px; border-radius: 18px; background: #8b5cf6; font-size: 14px; }
        .message-composer button:hover { background: #7c3aed; }
        .message-feed { max-height: 430px; overflow-y: auto; padding: 4px 3px 4px 0; }
        #messageList li { display: block; width: fit-content; max-width: 94%; margin: 0 0 10px; padding: 10px 13px; border: 1px solid #55457b; border-radius: 14px 14px 14px 4px; background: #39304f; }
        #messageList li:nth-child(even) { margin-left: auto; border-color: #3e5371; border-radius: 14px 14px 4px 14px; background: #293b50; }
        .message-text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; line-height: 1.45; }
        .message-time { display: block; margin-top: 6px; color: #c2b8dc; font-size: 11px; }
        .messages-panel .list-actions { margin: 8px 0 0; }
        .messages-panel .list-actions button { background: #443447; }
        .messages-panel .list-actions button:hover { background: #5a3d50; }
        .danger-btn { background: #b42318; }
        .danger-btn:hover { background: #8f1c13; }
        dialog { background: #1e1e1e; color: #e0e0e0; border: 1px solid #444; border-radius: 8px; padding: 20px; }
        dialog::backdrop { background: rgba(0,0,0,0.7); }
        .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
        .dialog-actions button { padding: 8px 12px; font-size: 14px; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { background: #2a2a2a; margin-bottom: 10px; padding: 14px; border-radius: 6px; display: flex; gap: 12px; align-items: center; }
        .link-details { flex: 1; min-width: 0; }
        a { color: #4da6ff; text-decoration: none; font-size: 16px; }
        a:hover { text-decoration: underline; }
        .link-url { display: block; margin-top: 4px; font-size: 12px; color: #888; overflow-wrap: anywhere; }
        .copy-btn { background: #3a3a3a; padding: 6px 12px; font-size: 12px; margin-left: 10px; }
        .copy-btn:hover { background: #4a4a4a; }
        @media (max-width: 760px) {
            .workspace-layout { grid-template-columns: 1fr; }
            .messages-panel { grid-row: 1; }
            .message-feed { max-height: 320px; }
        }
        @media (max-width: 480px) {
            body { padding: 10px; }
            .container { padding: 18px; }
            li { align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🌐 LAN Link Sharer</h2>
        <div class="input-group" style="flex-direction: column; gap: 10px;">
            <input type="text" id="titleInput" placeholder="Link Name / Title (Optional)" autocomplete="off">
            <div style="display: flex; gap: 10px; width: 100%;">
                <input type="text" id="urlInput" placeholder="Paste link here..." autocomplete="off" style="flex: 1;">
                <button onclick="sendLink()">Send</button>
            </div>
        </div>
        <div class="workspace-layout">
            <section aria-labelledby="linksHeading">
                <h3 id="linksHeading">Links</h3>
                <div class="list-actions">
                    <button id="clearAllButton" class="danger-btn" onclick="clearAllLinks()" disabled>Clear All Links</button>
                </div>
                <ul id="linkList"></ul>
                <p id="emptyState">No links shared yet.</p>
            </section>
            <aside class="messages-panel" aria-labelledby="messagesHeading">
                <h3 id="messagesHeading" class="messages-heading"><span class="chat-icon" aria-hidden="true">✦</span> Chat</h3>
                <div class="message-feed">
                    <ul id="messageList" aria-live="polite"></ul>
                    <p id="emptyMessagesState">No messages yet. Start the chat!</p>
                </div>
                <div class="message-composer">
                    <textarea id="messageInput" maxlength="2000" placeholder="Say something..." aria-label="Message"></textarea>
                    <button onclick="sendMessage()">Send message ✨</button>
                </div>
                <div class="list-actions">
                    <button id="clearMessagesButton" onclick="clearMessages()" disabled>Clear chat</button>
                </div>
            </aside>
        </div>
        <dialog id="clearKeyDialog">
            <form id="clearKeyForm">
                <label for="clearKeyInput">Enter the key to clear all links:</label>
                <input type="password" id="clearKeyInput" autocomplete="current-password" required style="display: block; width: 100%; margin-top: 10px;">
                <div class="dialog-actions">
                    <button type="button" onclick="document.getElementById('clearKeyDialog').close()">Cancel</button>
                    <button type="submit" class="danger-btn">Clear All</button>
                </div>
            </form>
        </dialog>
    </div>

    <script>
        const socket = io();

        socket.on('load_history', function(links) {
            const list = document.getElementById('linkList');
            list.innerHTML = '';
            links.forEach(addLinkToList);
        });

        socket.on('receive_link', function(data) {
            addLinkToList(data, true);
        });

        socket.on('load_messages', function(messages) {
            const list = document.getElementById('messageList');
            list.replaceChildren();
            messages.forEach(addMessageToList);
            updateMessageActions();
        });

        socket.on('receive_message', function(data) {
            addMessageToList(data, true);
        });

        socket.on('messages_cleared', function() {
            document.getElementById('messageList').replaceChildren();
            updateMessageActions();
        });

        socket.on('links_cleared', function() {
            document.getElementById('linkList').replaceChildren();
            updateListActions();
        });

        function sendLink() {
            const urlInput = document.getElementById('urlInput');
            const titleInput = document.getElementById('titleInput');
            
            if (urlInput.value.trim() !== '') {
                socket.emit('share_link', { 
                    url: urlInput.value.trim(),
                    title: titleInput.value.trim()
                }, function(result) {
                    if (!result || !result.success) {
                        window.alert(result && result.message ? result.message : 'Unable to save the link.');
                    } else if (result.link) {
                        addLinkToList(result.link, true);
                    }
                });
                urlInput.value = '';
                titleInput.value = '';
            }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            socket.emit('share_message', { text: text }, function(result) {
                if (!result || !result.success) {
                    window.alert(result && result.message ? result.message : 'Unable to send the message.');
                } else {
                    if (result.message) addMessageToList(result.message, true);
                    input.value = '';
                }
            });
        }

        document.getElementById('urlInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendLink();
        });
        document.getElementById('titleInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendLink();
        });
        document.getElementById('messageInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        document.getElementById('clearKeyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const keyInput = document.getElementById('clearKeyInput');
            const key = keyInput.value;
            keyInput.value = '';
            document.getElementById('clearKeyDialog').close();

            socket.emit('clear_links', { key: key }, function(result) {
                if (!result || !result.success) {
                    window.alert(result && result.message ? result.message : 'Unable to clear links.');
                }
            });
        });

        function addLinkToList(data, prepend = false) {
            const list = document.getElementById('linkList');
            if (Array.from(list.children).some(function(item) { return item.dataset.linkId === data.id; })) {
                return;
            }
            const li = document.createElement('li');
            li.dataset.linkId = data.id;

            const details = document.createElement('div');
            details.className = 'link-details';
            const anchor = document.createElement('a');
            anchor.href = data.url;
            anchor.target = '_blank';
            anchor.rel = 'noopener noreferrer';
            anchor.style.fontWeight = 'bold';
            anchor.textContent = data.title || data.url;

            const url = document.createElement('span');
            url.className = 'link-url';
            url.textContent = data.url;
            details.append(anchor, url);

            const copyButton = document.createElement('button');
            copyButton.className = 'copy-btn';
            copyButton.textContent = 'Copy';
            copyButton.addEventListener('click', function() {
                copyToClipboard(data.url);
            });

            li.append(details, copyButton);

            if (prepend && list.firstChild) {
                list.insertBefore(li, list.firstChild);
            } else {
                list.appendChild(li);
            }
            updateListActions();
        }

        function addMessageToList(data, prepend = false) {
            const list = document.getElementById('messageList');
            if (Array.from(list.children).some(function(item) { return item.dataset.messageId === data.id; })) {
                return;
            }

            const item = document.createElement('li');
            item.className = 'message-item';
            item.dataset.messageId = data.id;

            const text = document.createElement('div');
            text.className = 'message-text';
            text.textContent = data.text;

            const time = document.createElement('span');
            time.className = 'message-time';
            time.textContent = new Date(data.created_at).toLocaleString();
            text.appendChild(time);
            item.appendChild(text);

            if (prepend && list.firstChild) {
                list.insertBefore(item, list.firstChild);
            } else {
                list.appendChild(item);
            }
            updateMessageActions();
        }

        function clearAllLinks() {
            document.getElementById('clearKeyDialog').showModal();
            document.getElementById('clearKeyInput').focus();
        }

        function clearMessages() {
            if (!window.confirm('Clear all shared messages? This does not require the link-clear key.')) return;
            socket.emit('clear_messages', function(result) {
                if (!result || !result.success) {
                    window.alert(result && result.message ? result.message : 'Unable to clear messages.');
                }
            });
        }

        function updateListActions() {
            const hasLinks = document.querySelector('#linkList li') !== null;
            document.getElementById('clearAllButton').disabled = !hasLinks;
            document.getElementById('emptyState').hidden = hasLinks;
        }

        function updateMessageActions() {
            const hasMessages = document.querySelector('#messageList li') !== null;
            document.getElementById('clearMessagesButton').disabled = !hasMessages;
            document.getElementById('emptyMessagesState').hidden = hasMessages;
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
        }
    </script>
</body>
</html>
